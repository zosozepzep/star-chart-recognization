paths:
  output_root: output

segment:
  window: 5                 # 估计一个标准差所需的最少 ΔAZ 增量数；默认下被 min_length 吞并，仅 >=10 时才起作用
  std_threshold_deg: 0.05   # 稳定跟踪判据（数据集 B 实测 0.0144，见 docs/reports/measurements.md）
  min_length: 10            # 最短跟踪段帧数；同时排除数据集 A 的 5 帧静止段

background:
  box: 128
  filter_size: 3
  sigma: 3.0
  maxiters: 5
  backend: auto             # auto | cpu | gpu

hotpixel:
  n_sigma: 5.0
  flat_ratio: 0.10          # (max-min)/median 上限，判"数值锁定"；取自实测平台中部：0.07~0.15 均给出同样 5 簇，0.05 只给 4 簇（漏 (312,3206)），0.20 跳到 18 簇、0.30 跳到 242 簇
  dilate: 1                 # 簇整体膨胀像素数
  reject_radius_px: 8.0     # 探测结果剔除半径
  max_frames: 40            # 时间轴统计所用最大帧数（内存约束）

detect:
  report_n_sigma: 5.0       # 对外报数（复现率 90.3%）
  search_n_sigma: 4.0       # 目标搜索（弱帧 flux 仅 264）
  npixels: 5
  aperture_radius_px: 5.0

psf:
  box: 9
  max_nfev: 200
  max_residual_ratio: 0.55  # 裁决 33：原值 0.35 从未对真星测过，实测在数据集 B 第 30 帧 box=9 上只接受 38/95（40%）的 5σ 探测；0.55 保留 87/95（92%），同时仍拒掉灾难性失败区（空天窗口中位数 0.9229，最差真星 0.6504；配方见 src/detect/psf.py 的 fit_gaussian2d docstring）。该判据 ≈1/SNR（corr(log flux, rr) = -0.665）而非形状检验，且依赖窗口尺寸（box=11 时通过率降到 23%），改 box 必须重测

register:
  center: [2047.5, 2047.5]
  rot_range_deg: 1.5
  rot_step_deg: 0.05
  shift_max_px: 400.0
  vote_bin_px: 4.0
  match_radius_px: 5.0
  min_inliers: 30           # 实测最低 74，裕度充足

target:
  track_radius_px: 8.0
  min_track_frames: 10
  v_det_max_px: 8.0         # 目标实测 1.8
  v_sky_min_px: 30.0        # 目标实测 126
  lock_span_px: 1.0         # 像素锁定判据：探测器系 2-D 跨度范数上限（绝对值，不随天球漂移缩放）。实测静止源质心的光子噪声抖动最差约 0.18 px（amp=200，30 帧 x 6 次试验，9x9 窗口 sigma=1.6 高斯），最慢真目标跨度 19.80 px；1.0 位于这段间隙中部，[0.5, 19] 内任意取值等效。原名 lock_ratio: 0.05 是按 drift_sky 缩放的比值，会把数据集 B 的目标（54 帧漂移 95.8 px，门限 0.05x6495=324.8 px）一并判为锁定

geometry:
  center_px: [2047.5, 2047.5]   # 4096 px 画面中心，0-based，x=列 y=行。Task 26 出图与国赛盲板求解的共用常量；目标轨迹本轮不用它（无 anchor），但模块体内不留裸数字，需要时从这里读

stack:
  window: 12                # 窗内累计场移约 1500 px，约 63% 图幅重叠
  step: 6
  min_coverage: 4           # N < 4 的像素标记不可用
  interp_order: 1

photometry:
  zero_point_source: truth  # truth | catalog | none
  min_zp_points: 3          # 零点拟合所需最少有效配对数。同时是 3σ 剪裁循环的进入门限（严格大于才进），所以恰好等于本值的输入只走未剪裁路径；提高本值必须同步 src/astrometry/photometry.py 的 MIN_ZP_POINTS

repeatability:
  sigmas: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 6.0, 8.0]
  match_radius_px: 3.0
  frames: 6                 # 参与复现率统计的帧数

orbit:
  bracket_km: [200.0, 40000.0]

viz:
  dpi: 150
  font_candidates: ["Noto Sans CJK SC", "Noto Sans CJK JP", "DejaVu Sans"]
