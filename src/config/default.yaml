paths:
  output_root: output

segment:
  window: 5                 # 估计一个标准差所需的最少 ΔAZ 增量数；默认下被 min_length 吞并，仅 >=10 时才起作用
  std_threshold_deg: 0.05   # 稳定跟踪判据（数据集 B 实测 0.0144，见 docs/reports/measurements.md）
  min_length: 10            # 最短跟踪段帧数；同时排除数据集 A 的 5 帧静止段

background:
  box: 128
  filter_size: 3
  sigma: 3.0
  maxiters: 5
  backend: auto             # auto | cpu | gpu

hotpixel:
  n_sigma: 5.0
  flat_ratio: 0.10          # (max-min)/median 上限，判"数值锁定"；取自实测平台中部：0.07~0.15 均给出同样 5 簇，0.05 只给 4 簇（漏 (312,3206)），0.20 跳到 18 簇、0.30 跳到 242 簇
  dilate: 1                 # 簇整体膨胀像素数
  reject_radius_px: 8.0     # 探测结果剔除半径
  max_frames: 40            # 时间轴统计所用最大帧数（内存约束）

detect:
  report_n_sigma: 5.0       # 对外报数（复现率 90.3%）
  search_n_sigma: 4.0       # 目标搜索（弱帧 flux 仅 264）
  npixels: 5
  aperture_radius_px: 5.0

psf:
  box: 9
  max_nfev: 200
  max_residual_ratio: 0.55  # 裁决 33：原值 0.35 从未对真星测过，实测在数据集 B 第 30 帧 box=9 上只接受 38/95（40%）的 5σ 探测；0.55 保留 87/95（92%），同时仍拒掉灾难性失败区（空天窗口中位数 0.9229，最差真星 0.6504；配方见 src/detect/psf.py 的 fit_gaussian2d docstring）。该判据 ≈1/SNR（corr(log flux, rr) = -0.665）而非形状检验，且依赖窗口尺寸（box=11 时通过率降到 23%），改 box 必须重测

register:
  center: [2047.5, 2047.5]
  rot_range_deg: 1.5
  rot_step_deg: 0.05
  shift_max_px: 400.0
  vote_bin_px: 4.0
  match_radius_px: 5.0
  min_inliers: 30           # 实测最低 74，裕度充足

target:
  track_radius_px: 8.0
  min_track_frames: 10
  v_det_max_px: 8.0         # 目标实测 1.8
  v_sky_min_px: 30.0        # 目标实测 126
  lock_span_px: 1.0         # 像素锁定判据：探测器系 2-D 跨度范数上限（绝对值，不随天球漂移缩放）。实测静止源质心的光子噪声抖动最差约 0.18 px（amp=200，30 帧 x 6 次试验，9x9 窗口 sigma=1.6 高斯），最慢真目标跨度 19.80 px；1.0 位于这段间隙中部，[0.5, 19] 内任意取值等效。原名 lock_ratio: 0.05 是按 drift_sky 缩放的比值，会把数据集 B 的目标（54 帧漂移 95.8 px，门限 0.05x6495=324.8 px）一并判为锁定

geometry:
  center_px: [2047.5, 2047.5]   # 4096 px 画面中心，0-based，x=列 y=行。Task 26 出图与国赛盲板求解的共用常量；目标轨迹本轮不用它（无 anchor），但模块体内不留裸数字，需要时从这里读

stack:
  window: 12                # 窗内累计场移约 1500 px，约 63% 图幅重叠
  step: 6
  min_coverage: 4           # N < 4 的像素标记不可用
  interp_order: 1

photometry:
  zero_point_source: truth  # truth | catalog | none
  min_zp_points: 3          # 零点拟合所需最少有效配对数。同时是 3σ 剪裁循环的进入门限（严格大于才进），所以恰好等于本值的输入只走未剪裁路径；提高本值必须同步 src/astrometry/photometry.py 的 MIN_ZP_POINTS
  max_clip_rounds: 5        # 3σ 剪裁的轮数上限。本项目算例 1 轮即收敛（干净点 sd==0 即停），上限从不咬住；咬住时会记 WARNING 而非静默。提高本值必须同步 src/astrometry/photometry.py 的 MAX_CLIP_ROUNDS

repeatability:
  sigmas: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 6.0, 8.0]
  match_radius_px: 3.0
  frames: 6                 # 参与复现率统计的帧数

orbit:
  bracket_km: [200.0, 40000.0]

sensor_health:
  # 坏点普查的帧预算。交付口径实测（历元 A，剔除第 0 行后）：
  # 5 帧 -> 115 簇，10 -> 8，15 -> 6，20 -> 4，25/30/36 -> 4。
  # 20 是收敛平台的起点，不是随手选的数字。
  report_frames: 20
  # 图像顶部的状态字行数。实测 px(0,0) 在两个历元都恰好是全帧最大值
  # （26975 / 26974 ADU），是同帧中部行中位数的 5395 / 2452 倍，
  # 而全帧 40 帧只在 26966-26991 之间动 —— 写入的常量，不是硅缺陷。
  # 第 1、2 行在两历元都没有任何异常像素，所以剔一行的代价为零。
  metadata_rows: 1
  # 跨历元配对半径。实测 0.5-16.0 px（32 倍跨度）下 n_common 恒定，不在悬崖上。
  match_radius_px: 3.0
  # 构成「跨历元」证据的最小间隔。本项目两历元实测相隔 134.158023 天。
  min_epoch_gap_days: 100.0
  # 天光面亮度的物理合理区间（mag/arcsec²）：城市微光夜空 .. 暗址夜空。
  # 这只是**合理性下限**，不是变异杀手：实测它的判别力随背景值变化，
  # 在 b=1 ADU 处归零（inst_mag=0，符号翻转与正确实现给出同一个 19.2897），
  # b=100 时正确实现给 14.2897、已被带拒。载荷断言是单调性与符号，见 R425。
  sky_mu_min: 15.0
  sky_mu_max: 23.0
  # 高斯拟合 sigma 的可接受区间（px）。实测 sigma=0、两轴同负、一正一负(nan)、
  # 1e6 四种都能穿过 isfinite 过滤器。真实数据上 sigma 实测 0.883-2.063，
  # 这个区间剔 0 个 —— 它防穿透，不是常态筛子。
  sigma_min_px: 0.3
  sigma_max_px: 20.0

viz:
  dpi: 150
  # 实测（matplotlib 3.10.9，本镜像 20 个可见字体，见 probe/t26-font.txt）：
  # SimHei 是唯一带汉字的字体（28562 字形，本项目 FIGURE_CJK 全部覆盖），
  # 其余 19 个（DejaVu 5 个 + STIX 7 个 + cm 7 个）在同一套字符上全部 100% 缺失。
  # Noto 两项与 WenQuanYi 在本镜像里都不存在，留在表里只为换交付镜像时优先命中
  # —— 本镜像的实测选中结果必然是 SimHei。
  # DejaVu Sans 已删除：它存在、名字查得到、汉字一个没有，留在表里的唯一作用
  # 是让选择逻辑「成功」选中一个把每个汉字画成空心方框的字体。
  # 回落由 matplotlib 自己兜底，不需要我们显式列出。
  font_candidates: ["SimHei", "Noto Sans CJK SC", "Noto Sans CJK JP", "WenQuanYi Zen Hei"]
  # 「这张图真的画了东西」的字节下界。实测（dpi=150，11 档 figsize，
  # 见 probe/t26-bytes.txt）：纯空白图最大 11288、空坐标轴图最大 20396、
  # 裸三点折线最小 23643。取 24000 —— 高于任何空坐标轴图。
  # 注意它挡不住「画了中文标签但没画数据」的图：那种图仅标签就有 46983 字节起，
  # 所以口径断言（probe 的 all_labels 与各图特有量）才是主判据，字节数只是地板。
  min_real_figure_bytes: 24000
