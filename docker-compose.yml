services:
  cpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: star-chart:cpu
    container_name: star_chart_cpu
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      MPLBACKEND: Agg
    volumes:
      - .:/workspace
    command: tail -f /dev/null

  gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    image: star-chart:gpu
    container_name: star_chart_gpu
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      MPLBACKEND: Agg
    volumes:
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: tail -f /dev/null
